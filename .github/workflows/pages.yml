# Copy this file to .github/workflows/pages.yml in the small PUBLIC repo that holds only
# the contents of this web/ folder (index.html, config.js). Then in that repo:
# Settings > Pages > Source: GitHub Actions. Every push to main republishes the page.
name: Publish simulator page
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
